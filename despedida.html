<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gracias por tu visita</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmccTxUeNKVr7nTneXeoGTO57oCA1qSOrtxA&s');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: brightness(0.5);
        }

        .contenido {
            background-color: rgba(85, 240, 243, 0.812);
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 30px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #1e8e4f;
        }
    </style>
</head>
<body>
    <div class="contenido">
        <h1>Hasta pronto desde Santa María Acú</h1>
        <p>"Donde la historia, la tradición y la calidez de su gente dejan huella en tu corazón."</p>
        <p>Gracias por tu visita virtual. ¡Te esperamos con los brazos abiertos en Halachó, Yucatán!</p>
        <a href="principal.html" class="btn">Regresar al Inicio</a>
    </div>
</body>
</html>
